name: Compile Standalone Portable Dictionary App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Adds an interactive "Run workflow" button on GitHub

jobs:
  bundle-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Native Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Compiling Requirements
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Bundle into One File Portable EXE
      run: |
        pyinstaller --onefile --noconsole --name="RwandanTrilingualLegalEditor" app.py

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: Portable-Windows-Legal-Dictionary-App
        path: dist/RwandanTrilingualLegalEditor.exe
